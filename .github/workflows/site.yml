name: Site

# Publica o site no GitHub Pages a cada push e, toda segunda-feira,
# baixa o catálogo da NASA de novo, refaz a auditoria e os modelos e publica.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * 1" # segunda-feira, 06:17 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  update-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Baixar o catálogo
        run: python pipeline/fetch.py
      - name: Auditar e modelar
        run: python pipeline/build.py data/live/pscomppars_latest.csv --label live --date "$(cat data/live/DATE)" --history
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live site/public/data
          git diff --cached --quiet || git commit -m "Atualização semanal do catálogo: $(cat data/live/DATE)"
          git push

  deploy:
    needs: update-data
    if: always() && (needs.update-data.result == 'success' || needs.update-data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
